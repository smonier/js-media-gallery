# Node Types
jsmediagallerynt_imageGallery=Image Gallery
jsmediagallerynt_imageGallery_description=Images from a folder or picked one by one, shown as a grid, a masonry, a carousel or a main image with thumbnails. Every image opens in a viewer.
jsmediagallerynt_videoGallery=Video Gallery
jsmediagallerynt_videoGallery_description=A list of internal and external videos, shown as a list, a grid that opens a player, or a featured player with a strip of thumbnails.
jsmediagallerynt_internalVideo=Internal Video
jsmediagallerynt_internalVideo_description=A video file of the media library, with an optional poster, captions and transcript.
jsmediagallerynt_externalVideo=External Video
jsmediagallerynt_externalVideo_description=A video of YouTube, Vimeo, Wistia, Dailymotion or a Storylane demo.
jsmediagallerynt_videoHeading=Video Hero Banner
jsmediagallerynt_videoHeading_description=A section with a muted background video, a title, a caption and a call to action.

# Mixins
jsmediagallerymix_component=Media Gallery Component
jsmediagallerymix_directoryLink=Directory Link
jsmediagallerymix_imagesLink=Images Link

# Image Gallery Properties
jsmediagallerynt_imageGallery.bannerText=Banner Text
jsmediagallerynt_imageGallery.bannerText.ui.tooltip=Rich text displayed at the top of the gallery to provide context or description. Headings inside it are placed under the gallery title.
jsmediagallerynt_imageGallery.imgGalleryType=Gallery Type
jsmediagallerynt_imageGallery.imgGalleryType.ui.tooltip=Choose how to select images: from a folder or manually select individual images.
jsmediagallerymix_directoryLink.folder=Image Folder
jsmediagallerymix_directoryLink.folder.ui.tooltip=Select a folder containing the images to display in the gallery. The <b>title</b> of each image in the media library is its text alternative: give every image a title that describes it.
jsmediagallerymix_imagesLink.imagesList=Select Images
jsmediagallerymix_imagesLink.imagesList.ui.tooltip=Manually select individual images to include in the gallery. The <b>title</b> of each image in the media library is its text alternative: give every image a title that describes it.
jsmediagallerymix_linkTo=Link
jsmediagallerymix_linkTo.j_linkType=Link
jsmediagallerymix_linkTo.j_linkType.ui.tooltip=Where the call to action goes: a page of this site, a web address, or no link. The target is set for each language.
jsmediagallerymix_linkTo.j_linkType.none=No link
jsmediagallerymix_linkTo.j_linkType.internal=Page of this site
jsmediagallerymix_linkTo.j_linkType.external=Web address
jsmediagallerymix_linkTo.openInNewTab=Open in a new tab
jsmediagallerymix_linkTo.openInNewTab.ui.tooltip=Opens the link in a new browser tab. Screen readers announce it. Keep it for links to other websites.
jsmediagallerynt_imageGallery.folder=Image Folder
jsmediagallerynt_imageGallery.folder.ui.tooltip=Select a folder containing the images to display in the gallery.
jsmediagallerynt_imageGallery.imagesList=Select Images
jsmediagallerynt_imageGallery.imagesList.ui.tooltip=Manually select individual images to include in the gallery.

# Video Gallery Properties
jsmediagallerynt_videoGallery.bannerText=Banner Text
jsmediagallerynt_videoGallery.bannerText.ui.tooltip=Rich text displayed at the top of the gallery to provide context or description. Headings inside it are placed under the gallery title.
jsmediagallerynt_videoGallery.itemWidth=Item Width (px)
jsmediagallerynt_videoGallery.itemWidth.ui.tooltip=Minimum width in pixels of each video card in the grid layout (recommended: 150-400px). On small screens a card is never wider than the screen.

# Internal Video Properties
jsmediagallerynt_internalVideo.videoDesc=Description
jsmediagallerynt_internalVideo.videoDesc.ui.tooltip=Short plain text shown with the video.
jsmediagallerynt_internalVideo.video=Video File
jsmediagallerynt_internalVideo.video.ui.tooltip=Select a video file hosted in Jahia (MP4, WebM, or OGG format).
jsmediagallerynt_internalVideo.videoPoster=Video Poster Image
jsmediagallerynt_internalVideo.videoPoster.ui.tooltip=Optional image displayed before the video plays (16:9 aspect ratio recommended).
jsmediagallerynt_internalVideo.captions=Captions File
jsmediagallerynt_internalVideo.captions.ui.tooltip=Captions of the video in this language, as a <b>WebVTT</b> file (.vtt) of the media library. Required for a video with speech or meaningful sound (RGAA 4.3).
jsmediagallerynt_internalVideo.transcript=Transcript
jsmediagallerynt_internalVideo.transcript.ui.tooltip=Text version of the video (speech, sounds and what is shown), displayed under the player in a collapsible section (RGAA 4.1).
jsmediagallerynt_internalVideo.featured=Featured Video
jsmediagallerynt_internalVideo.featured.ui.tooltip=Mark this video as featured to show it first in the featured gallery view.

# External Video Properties
jsmediagallerynt_externalVideo.videoDesc=Description
jsmediagallerynt_externalVideo.videoDesc.ui.tooltip=Short plain text shown with the video.
jsmediagallerynt_externalVideo.videoService=Video Service
jsmediagallerynt_externalVideo.videoService.ui.tooltip=Select the video hosting service for this video.
jsmediagallerynt_externalVideo.videoId=Video ID or address
jsmediagallerynt_externalVideo.videoId.ui.tooltip=The video ID (for YouTube: youtube.com/watch?v=<b>VIDEO_ID</b>) or the address of the video on the selected service. Anything else is ignored.
jsmediagallerynt_externalVideo.videoPoster=Video Poster Image
jsmediagallerynt_externalVideo.videoPoster.ui.tooltip=Optional custom thumbnail. If not provided, the service thumbnail will be used automatically.
jsmediagallerynt_externalVideo.transcript=Transcript
jsmediagallerynt_externalVideo.transcript.ui.tooltip=Text version of the video (speech, sounds and what is shown), displayed under the player in a collapsible section (RGAA 4.1). Turn on the captions of the video on the service itself.
jsmediagallerynt_externalVideo.featured=Featured Video
jsmediagallerynt_externalVideo.featured.ui.tooltip=Mark this video as featured to show it first in the featured gallery view.

# Video Heading Properties
jsmediagallerynt_videoHeading.video=Video File
jsmediagallerynt_videoHeading.video.ui.tooltip=Select a video file to use as the background of the banner. It is muted, loops, and does not start for visitors who ask for reduced motion. Visitors can pause it.
jsmediagallerynt_videoHeading.videoPoster=Poster Image
jsmediagallerynt_videoHeading.videoPoster.ui.tooltip=Optional image shown while the video loads and when it does not play.
jsmediagallerynt_videoHeading.caption=Caption
jsmediagallerynt_videoHeading.caption.ui.tooltip=Rich text caption displayed over the video background.
jsmediagallerynt_videoHeading.ctaLabel=Call to Action Label
jsmediagallerynt_videoHeading.ctaLabel.ui.tooltip=Text of the call to action button. The button shows when a link and a label are set.

