# Types de nœuds
jsmediagallerynt_imageGallery=Galerie d'images
jsmediagallerynt_imageGallery_description=Des images d'un dossier ou choisies une à une, en grille, en maçonnerie, en carrousel ou en image principale avec vignettes. Chaque image s'ouvre dans une visionneuse.
jsmediagallerynt_videoGallery=Galerie de vidéos
jsmediagallerynt_videoGallery_description=Une liste de vidéos internes et externes, en liste, en grille qui ouvre un lecteur, ou en lecteur principal avec une bande de vignettes.
jsmediagallerynt_internalVideo=Vidéo interne
jsmediagallerynt_internalVideo_description=Un fichier vidéo de la médiathèque, avec une affiche, des sous-titres et une transcription facultatifs.
jsmediagallerynt_externalVideo=Vidéo externe
jsmediagallerynt_externalVideo_description=Une vidéo YouTube, Vimeo, Wistia, Dailymotion ou une démo Storylane.
jsmediagallerynt_videoHeading=Bannière vidéo héros
jsmediagallerynt_videoHeading_description=Une section avec une vidéo d'arrière-plan muette, un titre, une légende et un appel à l'action.

# Mixins
jsmediagallerymix_component=Composant de galerie multimédia
jsmediagallerymix_directoryLink=Lien répertoire
jsmediagallerymix_imagesLink=Lien images

# Propriétés de la galerie d'images
jsmediagallerynt_imageGallery.bannerText=Texte de bannière
jsmediagallerynt_imageGallery.bannerText.ui.tooltip=Texte enrichi affiché en haut de la galerie pour fournir un contexte ou une description. Ses titres sont placés sous le titre de la galerie.
jsmediagallerynt_imageGallery.imgGalleryType=Type de galerie
jsmediagallerynt_imageGallery.imgGalleryType.ui.tooltip=Choisissez comment sélectionner les images : depuis un dossier ou sélection manuelle d'images individuelles.
jsmediagallerymix_directoryLink.folder=Dossier d'images
jsmediagallerymix_directoryLink.folder.ui.tooltip=Sélectionnez un dossier contenant les images à afficher dans la galerie. Le <b>titre</b> de chaque image dans la médiathèque est son alternative textuelle : donnez à chaque image un titre qui la décrit.
jsmediagallerymix_imagesLink.imagesList=Sélectionner des images
jsmediagallerymix_imagesLink.imagesList.ui.tooltip=Sélectionnez manuellement les images à inclure dans la galerie. Le <b>titre</b> de chaque image dans la médiathèque est son alternative textuelle : donnez à chaque image un titre qui la décrit.
jsmediagallerynt_imageGallery.folder=Dossier d'images
jsmediagallerynt_imageGallery.folder.ui.tooltip=Sélectionnez un dossier contenant les images à afficher dans la galerie.
jsmediagallerynt_imageGallery.imagesList=Sélectionner des images
jsmediagallerynt_imageGallery.imagesList.ui.tooltip=Sélectionnez manuellement les images individuelles à inclure dans la galerie.

# Propriétés de la galerie de vidéos
jsmediagallerynt_videoGallery.bannerText=Texte de bannière
jsmediagallerynt_videoGallery.bannerText.ui.tooltip=Texte enrichi affiché en haut de la galerie pour fournir un contexte ou une description. Ses titres sont placés sous le titre de la galerie.
jsmediagallerynt_videoGallery.itemWidth=Largeur des éléments (px)
jsmediagallerynt_videoGallery.itemWidth.ui.tooltip=Largeur minimale en pixels de chaque carte vidéo dans la grille (recommandé : 150-400px). Sur petit écran, une carte n'est jamais plus large que l'écran.

# Propriétés de la vidéo interne
jsmediagallerynt_internalVideo.videoDesc=Description
jsmediagallerynt_internalVideo.videoDesc.ui.tooltip=Court texte brut affiché avec la vidéo.
jsmediagallerynt_internalVideo.video=Fichier vidéo
jsmediagallerynt_internalVideo.video.ui.tooltip=Sélectionnez un fichier vidéo hébergé dans Jahia (format MP4, WebM ou OGG).
jsmediagallerynt_internalVideo.videoPoster=Image d'affiche de la vidéo
jsmediagallerynt_internalVideo.videoPoster.ui.tooltip=Image optionnelle affichée avant la lecture de la vidéo (format 16:9 recommandé).
jsmediagallerynt_internalVideo.captions=Fichier de sous-titres
jsmediagallerynt_internalVideo.captions.ui.tooltip=Sous-titres de la vidéo dans cette langue, sous la forme d'un fichier <b>WebVTT</b> (.vtt) de la médiathèque. Obligatoire pour une vidéo avec de la parole ou des sons significatifs (RGAA 4.3).
jsmediagallerynt_internalVideo.transcript=Transcription
jsmediagallerynt_internalVideo.transcript.ui.tooltip=Version textuelle de la vidéo (paroles, sons et ce qui est montré), affichée sous le lecteur dans une section repliable (RGAA 4.1).
jsmediagallerynt_internalVideo.featured=Vidéo mise en avant
jsmediagallerynt_internalVideo.featured.ui.tooltip=Marquer cette vidéo comme mise en avant pour l'afficher en premier dans la vue de galerie mise en avant.

# Propriétés de la vidéo externe
jsmediagallerynt_externalVideo.videoDesc=Description
jsmediagallerynt_externalVideo.videoDesc.ui.tooltip=Court texte brut affiché avec la vidéo.
jsmediagallerynt_externalVideo.videoService=Service vidéo
jsmediagallerynt_externalVideo.videoService.ui.tooltip=Sélectionnez le service d'hébergement vidéo pour cette vidéo.
jsmediagallerynt_externalVideo.videoId=ID ou adresse de la vidéo
jsmediagallerynt_externalVideo.videoId.ui.tooltip=L'ID de la vidéo (pour YouTube : youtube.com/watch?v=<b>VIDEO_ID</b>) ou l'adresse de la vidéo sur le service choisi. Toute autre valeur est ignorée.
jsmediagallerynt_externalVideo.videoPoster=Image d'affiche de la vidéo
jsmediagallerynt_externalVideo.videoPoster.ui.tooltip=Vignette personnalisée optionnelle. Si non fournie, la vignette du service sera utilisée automatiquement.
jsmediagallerynt_externalVideo.transcript=Transcription
jsmediagallerynt_externalVideo.transcript.ui.tooltip=Version textuelle de la vidéo (paroles, sons et ce qui est montré), affichée sous le lecteur dans une section repliable (RGAA 4.1). Activez les sous-titres de la vidéo sur le service lui-même.
jsmediagallerynt_externalVideo.featured=Vidéo mise en avant
jsmediagallerynt_externalVideo.featured.ui.tooltip=Marquer cette vidéo comme mise en avant pour l'afficher en premier dans la vue de galerie mise en avant.

# Propriétés de la bannière vidéo
jsmediagallerynt_videoHeading.video=Fichier vidéo
jsmediagallerynt_videoHeading.video.ui.tooltip=Sélectionnez un fichier vidéo pour l'arrière-plan de la bannière. Elle est muette, tourne en boucle et ne démarre pas pour les visiteurs qui demandent moins d'animations. Les visiteurs peuvent la mettre en pause.
jsmediagallerynt_videoHeading.videoPoster=Image d'affiche
jsmediagallerynt_videoHeading.videoPoster.ui.tooltip=Image optionnelle affichée pendant le chargement de la vidéo et quand elle n'est pas lue.
jsmediagallerynt_videoHeading.caption=Légende
jsmediagallerynt_videoHeading.caption.ui.tooltip=Légende en texte enrichi affichée par-dessus l'arrière-plan vidéo.
jsmediagallerynt_videoHeading.ctaLabel=Libellé de l'appel à l'action
jsmediagallerynt_videoHeading.ctaLabel.ui.tooltip=Texte du bouton d'appel à l'action. Le bouton s'affiche quand un lien et un libellé sont renseignés.

